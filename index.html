<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doll Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f1e7d6;
    --panel: #e8dcc6;
    --ink: #3a2630;
    --ribbon: #a94a5a;
    --ribbon-blue: #345f7a;
    --muted: #8a7068;
    --gilt: #b48a48;
    --leaf: #6e8a64;
    --rule: #c4b29a;
    --shadow: rgba(58, 38, 48, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(169, 74, 90, 0.05) 0 18px, transparent 19px),
      radial-gradient(circle at 78% 42%, rgba(110, 138, 100, 0.05) 0 14px, transparent 15px),
      radial-gradient(circle at 38% 78%, rgba(169, 74, 90, 0.05) 0 16px, transparent 17px),
      radial-gradient(circle at 88% 88%, rgba(110, 138, 100, 0.05) 0 14px, transparent 15px);
    background-size: 220px 260px;
    color: var(--ink);
    font-family: 'Bookman Old Style', 'Goudy Old Style', 'Georgia', 'Garamond', serif;
    max-width: 760px;
    margin: 2em auto;
    padding: 1em 2em 4em;
    line-height: 1.6;
  }
  h1 {
    font-variant: small-caps;
    letter-spacing: 0.22em;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.3em;
    text-align: center;
    font-weight: normal;
    margin-bottom: 0.2em;
    color: var(--ribbon);
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-style: italic;
    margin-top: 0;
    margin-bottom: 1.4em;
  }
  .frame {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 0.6em 1.4em 1em;
    box-shadow: 0 1px 0 var(--shadow), 0 6px 24px var(--shadow);
  }
  h2 {
    font-variant: small-caps;
    color: var(--gilt);
    margin-top: 1.6em;
    font-weight: normal;
    letter-spacing: 0.1em;
    border-bottom: 1px dotted var(--rule);
    padding-bottom: 0.2em;
    font-size: 1em;
  }
  .id-card {
    text-align: center;
    padding: 0.7em 0 0.6em;
    border-bottom: 1px solid var(--rule);
    font-variant: small-caps;
    letter-spacing: 0.06em;
  }
  .id-card .maker { color: var(--ribbon); font-size: 1.05em; }
  .id-card .meta { color: var(--muted); font-size: 0.86em; margin-top: 0.15em; letter-spacing: 0.04em; }
  .vitals {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.4em 1.4em;
    padding: 0.6em 0.2em 0.7em;
    border-bottom: 1px solid var(--rule);
    font-variant: small-caps;
    letter-spacing: 0.04em;
    font-size: 0.92em;
  }
  .vitals .row { display: flex; align-items: center; gap: 0.5em; }
  .vitals .label { color: var(--muted); min-width: 5.6em; display: inline-block; }
  .vitals .bar {
    flex: 1;
    height: 0.55em;
    background: #d6c5a8;
    border: 1px solid var(--rule);
    border-radius: 1px;
    position: relative;
    overflow: hidden;
  }
  .vitals .bar > span {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: var(--leaf);
    transition: width 0.4s, background 0.4s;
  }
  .vitals .bar.low > span { background: var(--ribbon); }
  .vitals .bar.mid > span { background: var(--gilt); }
  .vitals .num {
    color: var(--ink);
    font-variant: tabular-nums;
    font-size: 0.85em;
    min-width: 2.2em;
    text-align: right;
  }
  .status {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3em 1.2em;
    padding: 0.5em 0.2em;
    border-bottom: 1px solid var(--rule);
    font-variant: small-caps;
    letter-spacing: 0.04em;
    font-size: 0.86em;
  }
  .status .label { color: var(--muted); margin-right: 0.4em; }
  .status strong { color: var(--ink); font-weight: normal; font-variant: normal; letter-spacing: 0; }
  .struct {
    padding: 0.5em 0.2em;
    border-bottom: 1px solid var(--rule);
    font-size: 0.85em;
    line-height: 1.5;
  }
  .struct .label {
    font-variant: small-caps;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-right: 0.4em;
  }
  .struct .piece, .struct .part {
    display: inline-block;
    padding: 0 0.3em;
    color: var(--ink);
  }
  .struct .piece.s-original { color: var(--leaf); }
  .struct .piece.s-period { color: var(--gilt); }
  .struct .piece.s-modern { color: var(--muted); }
  .struct .piece.s-damaged { color: var(--ribbon); }
  .struct .piece.s-missing { color: var(--ribbon); text-decoration: line-through; }
  .struct .part.attached { color: var(--leaf); }
  .struct .part.loose { color: var(--gilt); }
  .struct .part.detached { color: var(--ribbon); }
  .struct .part.missing { color: var(--ribbon); text-decoration: line-through; }
  .struct .body-line { margin-top: 0.15em; }
  .ribbons {
    display: flex;
    gap: 0.8em;
    align-items: center;
    padding: 0.5em 0.2em;
    border-bottom: 1px solid var(--rule);
    font-variant: small-caps;
    letter-spacing: 0.04em;
    font-size: 0.86em;
  }
  .ribbons .label { color: var(--muted); }
  .ribbons .pill {
    display: inline-block;
    padding: 0 0.5em;
    border: 1px solid;
    border-radius: 1em;
    margin-right: 0.3em;
    font-variant: tabular-nums;
  }
  .ribbons .pill.blue { color: var(--ribbon-blue); border-color: var(--ribbon-blue); }
  .ribbons .pill.red  { color: var(--ribbon); border-color: var(--ribbon); }
  .ribbons .pill.white { color: var(--muted); border-color: var(--muted); }
  .ribbons .pill.gold { color: var(--gilt); border-color: var(--gilt); }
  .ribbons .none { color: var(--muted); font-style: italic; }
  .log {
    min-height: 12em;
    max-height: 50vh;
    overflow-y: auto;
    padding: 1em 0.4em;
  }
  .log p { margin: 0.5em 0; }
  .log .narrator { color: var(--ink); }
  .log .doll {
    color: var(--ribbon);
    font-style: italic;
    margin-left: 1.4em;
    text-indent: -0.6em;
  }
  .log .doll::before { content: '\201C'; margin-right: 0.05em; }
  .log .doll::after { content: '\201D'; margin-left: 0.05em; }
  .log .system {
    color: var(--gilt);
    font-variant: small-caps;
    letter-spacing: 0.06em;
    font-size: 0.92em;
  }
  .log .system strong { color: var(--ink); font-weight: normal; }
  .log .scene-title {
    text-align: center;
    color: var(--muted);
    font-variant: small-caps;
    letter-spacing: 0.16em;
    margin: 0.8em 0 0.2em;
    font-size: 0.9em;
  }
  .log .stat-up { color: var(--leaf); }
  .log .stat-dn { color: var(--ribbon); }
  .log .item-acq { color: var(--gilt); font-style: italic; }
  .log .ribbon-blue { color: var(--ribbon-blue); font-variant: small-caps; letter-spacing: 0.08em; }
  .log .ribbon-red  { color: var(--ribbon); font-variant: small-caps; letter-spacing: 0.08em; }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 0.5em;
    padding-top: 0.8em;
    border-top: 1px solid var(--rule);
  }
  .controls .prompt {
    color: var(--muted);
    font-style: italic;
    font-size: 0.92em;
    margin-bottom: 0.2em;
    text-align: center;
  }
  button {
    background: #ede1cd;
    color: var(--ink);
    border: 1px solid var(--rule);
    padding: 0.7em 1.1em;
    font-family: inherit;
    font-size: 1em;
    cursor: pointer;
    text-align: left;
    transition: background 0.1s, border-color 0.1s, color 0.1s;
    line-height: 1.3;
  }
  button:hover:not(:disabled) {
    background: #f4e8d0;
    border-color: var(--ribbon);
    color: var(--ribbon);
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary {
    border-color: var(--ribbon);
    color: var(--ribbon);
    text-align: center;
    font-variant: small-caps;
    letter-spacing: 0.08em;
  }
  .item-list, .memory-list {
    columns: 2;
    column-gap: 1.6em;
    font-size: 0.9em;
    padding: 0.4em 0;
  }
  .item-list > div, .memory-list > div {
    break-inside: avoid;
    padding: 0.18em 0;
  }
  .item-list .ix-name { color: var(--ink); }
  .item-list .ix-flavor { color: var(--muted); font-size: 0.92em; }
  .item-list .ix-positive .ix-name { color: var(--leaf); }
  .item-list .ix-positive::before { content: "✦ "; color: var(--leaf); }
  .item-list .ix-damage::before { content: "· "; color: var(--ribbon); }
  .memory-list > div { color: var(--muted); font-style: italic; }
  .empty { color: var(--muted); font-style: italic; padding: 0.3em 0; }
  .end-screen { text-align: center; padding: 1.5em 0 0.5em; }
  .end-screen .verdict {
    font-size: 1.25em;
    color: var(--ribbon);
    margin: 0.6em 0;
    font-variant: small-caps;
    letter-spacing: 0.1em;
  }
  .end-screen .verdict.win { color: var(--ribbon-blue); }
  .end-screen .epitaph {
    color: var(--muted);
    font-style: italic;
    margin: 0.6em auto 1em;
    max-width: 32em;
  }
  .end-screen .totals {
    color: var(--ink);
    font-size: 0.9em;
    margin: 0.4em 0 1em;
  }

  /* doll selection screen */
  .select-intro {
    text-align: center;
    color: var(--muted);
    font-style: italic;
    margin: 0.4em 0 1em;
    font-size: 0.95em;
  }
  .doll-select {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.6em;
    padding: 0.4em 0 0.6em;
  }
  @media (max-width: 560px) {
    .doll-select { grid-template-columns: 1fr; }
  }
  .doll-option {
    background: #ede1cd;
    border: 1px solid var(--rule);
    padding: 0.6em 0.85em 0.7em;
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s;
    display: flex;
    flex-direction: column;
    gap: 0.15em;
  }
  .doll-option:hover { background: #f4e8d0; border-color: var(--ribbon); }
  .doll-option .opt-name {
    color: var(--ribbon);
    font-variant: small-caps;
    letter-spacing: 0.06em;
  }
  .doll-option .opt-meta {
    color: var(--muted);
    font-size: 0.84em;
    font-style: italic;
  }
  .doll-option .opt-note { font-size: 0.86em; padding: 0.2em 0 0.1em; color: var(--ink); }
  .doll-option .opt-stats {
    color: var(--gilt);
    font-size: 0.8em;
    font-variant: small-caps;
    letter-spacing: 0.05em;
    margin-top: 0.1em;
  }
  .doll-option .stars { letter-spacing: 0.08em; color: var(--ribbon); }
  .doll-option .stars.muted { color: var(--muted); }
  /* autoplay toolbar */
  .autoplay-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7em;
    padding: 0.8em 0.2em 0.3em;
    border-top: 1px solid var(--rule);
    margin-top: 0.6em;
    font-size: 0.86em;
  }
  .autoplay-btn {
    padding: 0.3em 0.9em;
    font-size: 0.88em;
    font-family: inherit;
    font-variant: small-caps;
    letter-spacing: 0.08em;
    text-align: center;
    background: #ede1cd;
    color: var(--ink);
    border: 1px solid var(--rule);
    cursor: pointer;
    line-height: 1.2;
  }
  .autoplay-btn:hover { background: #f4e8d0; border-color: var(--ribbon); color: var(--ribbon); }
  .autoplay-btn.playing {
    background: var(--ribbon);
    color: var(--bg);
    border-color: var(--ribbon);
  }
  .autoplay-btn.playing:hover { background: var(--ribbon); color: var(--bg); }
  .autoplay-hint { color: var(--muted); font-style: italic; }
  ::selection { background: var(--ribbon); color: var(--bg); }
</style>
</head>
<body>
  <h1>Doll Simulator</h1>
  <p class="subtitle">a record of your ownerships</p>

  <!-- doll selection screen -->
  <div id="select-screen" class="frame" style="display:none">
    <h2 style="border:none;text-align:center;color:var(--ribbon);margin-top:0.4em;letter-spacing:0.16em">Choose your doll</h2>
    <p class="select-intro">your starting doll is your difficulty setting. fragile dolls die fast; the more desirable a doll, the higher the reachable ribbon.</p>
    <div id="doll-select" class="doll-select"></div>
  </div>

  <!-- play screen -->
  <div id="play-screen" class="frame" style="display:none">
    <div class="id-card" id="id-card"></div>
    <div class="vitals" id="vitals"></div>
    <div class="status" id="status"></div>
    <div class="struct" id="struct"></div>
    <div class="ribbons" id="ribbons"></div>
    <div id="log" class="log"></div>
    <div id="controls" class="controls"></div>
    <div class="autoplay-row" id="autoplay-row">
      <button id="autoplay-btn" class="autoplay-btn">▶ play</button>
      <span class="autoplay-hint">auto-advance, picking thoughts at random</span>
    </div>
  </div>

  <h2>Marks and documentation</h2>
  <div id="items" class="item-list"></div>

  <h2>What is known about you</h2>
  <div id="memories" class="memory-list"></div>

<script>
"use strict";

// ============================================================
// helpers
// ============================================================

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pickN(arr, n) {
  const a = arr.slice();
  const out = [];
  while (out.length < n && a.length) {
    out.push(a.splice(Math.floor(Math.random() * a.length), 1)[0]);
  }
  return out;
}
function roll(p) { return Math.random() < p; }
function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
function rint(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
function stars(n, max) {
  const filled = '★'.repeat(clamp(n, 0, max));
  const empty = '☆'.repeat(max - clamp(n, 0, max));
  return filled + empty;
}

const REGISTRY_PREFIX = ["UFDC", "ANT", "GBC", "FCB", "K&R", "JM", "AM", "SH", "LEN", "EFF"];

// ============================================================
// wardrobe / body system
// ============================================================

const WARDROBE_PIECES = ["bonnet", "dress", "undergarments", "stockings", "shoeLeft", "shoeRight"];
const PIECE_LABEL = {
  bonnet: "bonnet",
  dress: "dress",
  undergarments: "undergarments",
  stockings: "stockings",
  shoeLeft: "L shoe",
  shoeRight: "R shoe",
};
function pieceLabel(d, p) {
  return (d.wardrobeLabels && d.wardrobeLabels[p]) || PIECE_LABEL[p];
}
function headLabel(d) {
  if (!d) return "Head";
  if (d.category === "Plush / Teddy Bear") return "Head/Fur";
  if (d.category === "Cloth") return "Face";
  if (d.category === "Wooden Character") return "Paint";
  if (d.category === "Hard Plastic") return "Plastic";
  if (d.category === "Composition") return "Composition";
  return "Bisque";
}
const PIECE_VALUE = {
  original: 100,
  period: 70,
  modern: 25,
  damaged: 40,
  missing: 0,
};
const PIECE_STATE_LABEL = {
  original: "orig",
  period: "period",
  modern: "modern",
  damaged: "damaged",
  missing: "missing",
};

function newWardrobe() {
  const w = {};
  for (const p of WARDROBE_PIECES) {
    w[p] = { state: "original" };
  }
  return w;
}

function costumeScore(d) {
  const vals = WARDROBE_PIECES.map(p => PIECE_VALUE[d.wardrobe[p].state] ?? 0);
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
}

function newBody() {
  return {
    leftArm: "attached",
    rightArm: "attached",
    leftLeg: "attached",
    rightLeg: "attached",
    integrity: 100,
    headAttached: true,
    faceShattered: false,
  };
}

const LIMB_KEYS = ["leftArm", "rightArm", "leftLeg", "rightLeg"];
const LIMB_STATES = ["attached", "loose", "detached", "missing"];
const FRAGILE_BODY_MATERIALS = ["kid leather", "cloth", "felt", "composition", "mohair"];
function isFragileBody(d) { return FRAGILE_BODY_MATERIALS.includes(d.bodyMaterial); }
const PIECE_STATES = ["original", "period", "modern", "damaged", "missing"];
const STAT_KEYS = ["bisque", "hair", "eyes", "provenance", "reputation"];  // bodyIntegrity handled separately
const LIMB_LABEL = { leftArm: "L arm", rightArm: "R arm", leftLeg: "L leg", rightLeg: "R leg" };

function limbsMissing(d) {
  return LIMB_KEYS.filter(l => d.body[l] === "missing").length;
}

function checkDeath(d) {
  if (d.body.faceShattered) return { kind: "destroyed", how: "the face shattered" };
  if (!d.body.headAttached) return { kind: "destroyed", how: "the head separated from the body" };
  if (d.body.integrity <= 0) return { kind: "destroyed", how: "the body disintegrated" };
  if (d.bisque <= 5) return { kind: "destroyed", how: "the bisque damage is beyond restoration" };
  if (limbsMissing(d) >= 3 && d.bisque < 30) return { kind: "destroyed", how: "structural integrity lost: limbs and body" };
  return null;
}

// ============================================================
// scenarios
// ============================================================
//
// SCENARIO SHAPE
// --------------
//   id:       unique string identifier (validated)
//   title:    display name shown in the scene-title separator
//   weight:   relative selection weight (0 = forced-only / terminal)
//   owners:   optional [owner_id, ...] — only fires when current owner matches
//   guard:    optional fn(d) -> bool — extra firing condition
//   setup:    fn(d) -> string — narrator's situational opening line
//   roll:     fn(d) -> outcome — see OUTCOME SHAPE below
//   thoughts: 3 strings OR fn(d) -> 3 strings — FLAVOR ONLY, no mechanical effect
//
// OUTCOME SHAPE (returned from roll(d))
// -------------------------------------
//   deltas:         { bisque|hair|eyes|provenance|reputation|bodyIntegrity: number }
//   wardrobeChange: { bonnet|dress|undergarments|stockings|shoeLeft|shoeRight: state }
//                   states: original | period | modern | damaged | missing
//   bodyChange:     { leftArm|rightArm|leftLeg|rightLeg: state, headAttached: bool, faceShattered: bool }
//                   limb states: attached | loose | detached | missing
//   item:           { id, name, flavor }   — duplicates by id are dropped
//   memory:         string                 — appended to "What is known about you"
//   narration:      string                 — body of the outcome description
//   ribbon:         "blue" | "red" | "white" | "none"
//   changeOwner:    bool — triggers a new owner roll
//   ownerForce:     owner_id — forces a specific archetype
//   flags:          { anyKey: anyValue }   — copied to doll for guards on later scenarios
//   runEnd:         { kind: "destroyed"|"blue_ribbon", how: string }
//   yearsElapsed:   number — overrides default 0–2 age advance
//
// THOUGHTS ARE FLAVOR ONLY. The outcome is rolled BEFORE thoughts are presented;
// all three buttons trigger the same outcome. The thought is quoted, then the
// world describes what was already going to happen.
//
// HELPERS
// -------
//   damageRoll({ branchName: { weight, ...outcomeFields }, ... })
//       -> a roll() function that picks one branch by weight. Each outcome field
//          may be a static value OR fn(d) -> value, so branches can compute
//          against the doll (body material, current stats, etc).
//
//   uniqueItem(d, { name, flavor, prefix })
//       -> { id: prefix + "_" + d.scenarioCount, name, flavor }
//          Use when the same scenario can fire multiple times in a run and you
//          want each instance to record a separate item. Without this, the second
//          firing's item is silently dropped by the duplicate-id check.
//
//   isFragileBody(d) -> bool
//       True when the body material rots under water, moths, or flooding
//       (kid leather, cloth, felt, composition, mohair).
//
// VALIDATION
// ----------
// addScenario() warns on common mistakes (duplicate id, missing setup/roll,
// unknown owner id, wrong thoughts shape). Open the browser console to see them.
// applyOutcome() warns on unknown delta keys, wardrobe pieces, or body parts —
// catches typos like { bisques: -8 } or { rightARM: "loose" } at runtime.

const SCENARIOS = [];

function addScenario(s) {
  // Validation — warnings only, scenario is still pushed
  const tag = s && s.id ? `[scenario ${s.id}]` : `[scenario]`;
  if (!s || typeof s !== "object") { console.warn(`${tag} not an object`); return; }
  if (!s.id) console.warn(`${tag} missing id`);
  else if (SCENARIOS.some(x => x.id === s.id)) console.warn(`${tag} duplicate id`);
  if (!s.title) console.warn(`${tag} missing title`);
  if (typeof s.weight !== "number") console.warn(`${tag} weight should be a number`);
  if (typeof s.setup !== "function") console.warn(`${tag} setup must be fn(d) -> string`);
  if (typeof s.roll !== "function") console.warn(`${tag} roll must be fn(d) -> outcome`);
  if (s.owners) {
    if (!Array.isArray(s.owners)) console.warn(`${tag} owners must be an array`);
    else for (const oid of s.owners) {
      if (!OWNER_TYPES.some(o => o.id === oid)) console.warn(`${tag} unknown owner id: ${oid}`);
    }
  }
  // thoughts: optional flavor data, no longer rendered as buttons (kept for possible
  // future revival as occasional narrator italics). No shape requirement.
  SCENARIOS.push(s);
}

// Roll-builder for the common multi-tier damage pattern.
// Branches are weighted-picked; each branch's fields may be static or fn(d).
const _OUTCOME_FIELDS = ["deltas", "wardrobeChange", "bodyChange", "item",
  "memory", "narration", "ribbon", "changeOwner", "ownerForce", "flags",
  "runEnd", "yearsElapsed"];
function damageRoll(branches) {
  const entries = Object.entries(branches);
  for (const [name, b] of entries) {
    if (typeof b.weight !== "number") console.warn(`damageRoll branch ${name} missing weight`);
  }
  return d => {
    const total = entries.reduce((a, [, b]) => a + (b.weight || 0), 0);
    let r = Math.random() * total;
    for (const [, branch] of entries) {
      r -= (branch.weight || 0);
      if (r <= 0) {
        const out = {};
        for (const k of _OUTCOME_FIELDS) {
          if (branch[k] === undefined) continue;
          out[k] = (typeof branch[k] === "function") ? branch[k](d) : branch[k];
        }
        return out;
      }
    }
    return {};
  };
}

// Item factory for stackable items (multiple firings of the same scenario).
// Pass-through of positive/any other fields via spread.
function uniqueItem(d, base) {
  const { prefix, ...rest } = base;
  return { id: prefix + "_" + d.scenarioCount, ...rest };
}

addScenario({
  id: "regional",
  title: "a regional show",
  weight: 6,
  owners: ["serious"],
  guard: d => d.bisque > 50 && d.daysWithOwner >= 2 && (d.lastShowAt === undefined || d.scenarioCount - d.lastShowAt > 3),
  setup: d => `A folding table, blue cloth, a numbered card. Three judges with clipboards. A row of competitors, none of them, you note, ${d.maker}.`,
  roll: d => {
    const cs = costumeScore(d);
    const score = d.bisque * 0.35 + cs * 0.15 + d.hair * 0.1 + d.eyes * 0.1 + d.provenance * 0.15 + d.reputation * 0.15;
    const noise = (Math.random() - 0.5) * 25;
    const ceiling = 78 - (5 - d.desirability) * 4;
    const total = score + noise;
    let ribbon = "none", deltas = { reputation: rint(1, 3) }, line;
    const extras = [];
    if (total > ceiling) {
      ribbon = "blue"; deltas.reputation = rint(8, 14); deltas.provenance = rint(2, 4);
      line = `Blue. The judges sign the card. The owner does not breathe out for several seconds.`;
      // theme awards on a strong showing

        extras.push("originalCostume");
        line += ` She also takes Original Costume — every piece on her dates to the maker's era.`;
      }
      if (total > ceiling + 10) {
        extras.push("bestOfClass");
        line += ` And — the surprise of the morning — Best of Class.`;
      }
    } else if (total > ceiling - 13) {
      ribbon = "red"; deltas.reputation = rint(4, 8);
      line = `Red. Second in your category. The owner is satisfied. She tells the story for years anyway.`;
    } else if (total > ceiling - 28) {
      ribbon = "white"; deltas.reputation = rint(2, 5);
      line = `White. Third. Honorable mention. The owner pretends she expected this. She did not expect this.`;
    } else {
      line = `No ribbon. The judges are polite. The competition was, the owner concedes on the drive home, "very strong this year."`;
    }

addScenario({
  id: "nationals",
  title: "the UFDC national convention",
  weight: 0,
  owners: ["serious"],
  guard: d => d.ribbons.blue + d.ribbons.red >= 2 && d.bisque > 60 && !d.attendedNationals,
  setup: d => `A hotel ballroom in St. Louis. Or Anaheim. Or Orlando. The convention banner reads UFDC NATIONAL — JUDGED COMPETITION. The owner is wearing a member badge that lists three states she has lived in.`,
  roll: d => {
    const cs = costumeScore(d);
    const score = d.bisque * 0.4 + cs * 0.15 + d.hair * 0.1 + d.eyes * 0.1 + d.provenance * 0.1 + d.reputation * 0.15;
    const noise = (Math.random() - 0.5) * 18;
    const ceiling = 84 - (5 - d.desirability) * 3;
    const total = score + noise;
    let ribbon = "none", line, end = null;
    const extras = [];
    const deltas = { reputation: rint(8, 14), provenance: rint(4, 8) };
    if (total > ceiling) {
      ribbon = "blue"; deltas.reputation += rint(6, 10);
      // theme award on strong original costume
      if (cs >= 85 && WARDROBE_PIECES.every(p => ["original","period"].includes(d.wardrobe[p].state))) {
        extras.push("originalCostume");
      }
      // best of show — only at nationals, only for top scores
      if (total > ceiling + 12) {
        extras.push("bestOfShow");
        line = `BEST OF SHOW. The convention's highest award. The hush in the ballroom is real. The owner is asked to come to the stage and forgets, briefly, how walking works.`;
      } else {
        line = `BLUE. First in your category at Nationals. The owner is asked, in a hallway, to be photographed with you. She says yes. She has practiced saying yes for thirty years.`;
      }
      end = { kind: "blue_ribbon", bestOfShow: extras.includes("bestOfShow") };
    } else if (total > ceiling - 12) {
      ribbon = "red"; deltas.reputation += rint(4, 7);
      line = `Red ribbon at Nationals. Second. She says, in the elevator, that she will bring you back. She means it.`;
    } else if (total > ceiling - 24) {
      ribbon = "white";
      line = `White ribbon at Nationals. The judges are kinder than they need to be. The owner reads the comments on the back of the card three times.`;
    } else {
      line = `No ribbon at Nationals. The category was, frankly, brutal. The owner is dignified about it on the way home.`;
    }
    return {
      deltas, ribbon, ribbonAwards: extras,
      memory: `You were entered at the UFDC National Convention.`,
      narration: line,
      flags: { showCompleted: true, attendedNationals: true },
      runEnd: end,
      yearsElapsed: 1,
    };
  },
  thoughts: d => [
    "Yes. The blue ribbon. I have earned it.",
    "Look at me look at me look at me.",
    `I am ${d.age} years old. They will see what I am.`,
  ],
});

addScenario({
  id: "restoration",
  title: "the restoration",
  weight: 8,
  owners: ["restorer"],
  setup: d => `A bench. Bright lights. A wooden stand. A box labeled REPLACEMENT EYES, sorted by size, color, and decade.`,
  roll: d => {
    const repairs = [];
    const deltas = {};
    const bodyChange = {};
    if (d.bisque < 60) { deltas.bisque = rint(15, 30); repairs.push(headLabel(d).toLowerCase() + " stabilized"); }
    if (d.hair < 50) { deltas.hair = rint(15, 30); repairs.push(d.category === "Plush / Teddy Bear" ? "fur retouched" : d.category === "Cloth" || d.category === "Wooden Character" ? "hair retouched" : "wig replaced"); }
    if (d.eyes < 50) { deltas.eyes = rint(10, 25); repairs.push("eye mechanism repaired"); }
    if (d.body.integrity < 50) { deltas.bodyIntegrity = rint(10, 25); repairs.push("body shored up"); }
    for (const limb of LIMB_KEYS) {
      if (d.body[limb] === "detached") { bodyChange[limb] = "loose"; repairs.push(LIMB_LABEL[limb] + " reattached"); }
      else if (d.body[limb] === "loose") { bodyChange[limb] = "attached"; repairs.push(LIMB_LABEL[limb] + " tightened"); }
    }
    if (repairs.length === 0) repairs.push("light cleaning");
    deltas.provenance = -rint(3, 7);
    const item = { id: "restoration_" + d.scenarioCount, name: `restoration: ${repairs.join(", ")}`, flavor: "documented; deductible at any future judging" };
    return { deltas, bodyChange, item, memory: `You were restored: ${repairs.join(", ")}.`, narration: `She works for two days. You leave looking, in some respects, better than when you arrived. In other respects you are no longer entirely yourself.`, yearsElapsed: rint(0, 1) };
  },
  thoughts: ["Be gentle.", "Replace nothing you do not have to.", "I would rather be cracked than counterfeit."],
});

addScenario({

  title: "the basement",
  weight: 2,
  owners: ["hoarder", "inheritor", "estate"],
  setup: d => `She has stored the box in the basement. The basement, last spring, took on water. She has not yet noticed.`,
  roll: d => {
    const fragileBody = ["kid leather","cloth","felt","composition","mohair"].includes(d.bodyMaterial);
    const r = Math.random();
    if (r < 0.4) {
      return {
        deltas: { bisque: -rint(3, 6), hair: -rint(4, 8) },
        wardrobeChange: { dress: "damaged", undergarments: "damaged" },
        item: { id: "basement_smell", name: "a faint basement smell", flavor: "no amount of fresh air resolves it" },
        narration: `Some moisture got in. The dress is darkened at the hem. The smell will outlast the owner.`,
        yearsElapsed: rint(1, 2),
      };
    } else if (r < 0.85) {
      const bodyHit = fragileBody ? -rint(20, 35) : -8;
      return {
        deltas: { bisque: -rint(6, 12), hair: -rint(8, 14), bodyIntegrity: bodyHit },
        wardrobeChange: { dress: "damaged", undergarments: "damaged", bonnet: "damaged" },
        item: { id: "basement_water", name: "long-term basement-water damage", flavor: fragileBody ? "the body has begun to fail" : "the cloth is permanently musty" },

        yearsElapsed: rint(2, 4),
      };
    } else {
      if (fragileBody) {
        return {
          deltas: { bodyIntegrity: -100 },
          runEnd: { kind: "destroyed", how: "long-term basement water destroyed your " + d.bodyMaterial + " body" },
          narration: `She finds the box years later. The cardboard has decomposed. The ${d.bodyMaterial} has not survived. The bisque, miraculously, is intact — but there is nothing to attach it to.`,

      }
      return {
        deltas: { bisque: -30, hair: -25, bodyIntegrity: -40 },
        item: { id: "flood_destroyed", name: "extensive water and mildew damage", flavor: "from a flooded basement no one checked" },
        narration: `She finds the box years later. You are damaged, comprehensively. Restoration is possible but extensive.`,
        yearsElapsed: rint(2, 4),
      };
    }

  thoughts: ["Above-grade storage. Always above-grade.", "It is wet here.", "If this becomes mold, that is the end."],
});

      return { deltas: { reputation: 2 }, narration: `It is a ${newMate.maker} ${newMate.mold}. The owner places it next to you with palpable pride. You decide, in your own way, to be welcoming.`, yearsElapsed: 0 };

    narration: `You watch the room. The radiator clicks. The light moves across the wall once. You are, for a moment, simply yourself.`
  }),
  thoughts: d => [
    "The light is correct.",
    `I am ${d.age} years old.`,
    "Nothing is required of me.",
  ],
});

// ============================================================
// state
// ============================================================

const state = {
  doll: null,
  ended: false,
  phase: "select",  // "select" | "playing" | "ended"
  autoplay: false,
  autoplayTimer: null,
};

// ============================================================
// DOM
// ============================================================

const $selectScreen = document.getElementById('select-screen');
const $playScreen = document.getElementById('play-screen');
const $dollSelect = document.getElementById('doll-select');
const $idCard = document.getElementById('id-card');
const $vitals = document.getElementById('vitals');
const $status = document.getElementById('status');
const $struct = document.getElementById('struct');
const $ribbons = document.getElementById('ribbons');
const $log = document.getElementById('log');
const $controls = document.getElementById('controls');
const $items = document.getElementById('items');
const $memories = document.getElementById('memories');
const $autoplayBtn = document.getElementById('autoplay-btn');
$autoplayBtn.onclick = () => setAutoplay(!state.autoplay);

// ============================================================
// rendering
// ============================================================

function bar(value) {
  const v = clamp(value, 0, 100);
  const cls = v < 25 ? 'low' : v < 55 ? 'mid' : '';
  return `<span class="bar ${cls}"><span style="width:${v}%"></span></span><span class="num">${Math.round(v)}</span>`;
}
function ageDisplay(d) {
  const total = d.ageMonths || 0;
  const years = Math.floor(total / 12);
  const months = total % 12;
  return months === 0 ? `${years} years` : `${years} years, ${months} mo`;
}

function renderIdCard() {
  if (!state.doll) { $idCard.innerHTML = ''; return; }
  const d = state.doll;
  $idCard.innerHTML = `
    <div class="maker">${d.maker} ${d.mold}</div>
    <div class="meta">${d.year} · ${d.category} · ${d.height}" · reg. ${d.regNumber}</div>
  `;
}

function renderVitals() {
  if (!state.doll) { $vitals.innerHTML = ''; return; }
  const d = state.doll;
  $vitals.innerHTML = `
    <div class="row"><span class="label">${headLabel(d)}</span>${bar(d.bisque)}</div>
    <div class="row"><span class="label">Costume</span>${bar(costumeScore(d))}</div>
    <div class="row"><span class="label">Hair</span>${bar(d.hair)}</div>
    <div class="row"><span class="label">Eyes</span>${bar(d.eyes)}</div>
    <div class="row"><span class="label">Provenance</span>${bar(d.provenance)}</div>
    <div class="row"><span class="label">Reputation</span>${bar(d.reputation)}</div>
  `;
}

function renderStatus() {
  if (!state.doll) { $status.innerHTML = ''; return; }
  const d = state.doll;
  const mates = d.owner.collectionMates || [];
  const matesLine = mates.length === 0 ? '' :
    `<div style="flex-basis:100%"><span class="label">Cabinet</span> <strong>${mates.map(m => m.maker + " " + m.mold).join(", ")}</strong></div>`;
  $status.innerHTML = `
    <div><span class="label">Age</span> <strong>${ageDisplay(d)}</strong></div>
    <div><span class="label">Owner</span> <strong>${d.owner.label}</strong></div>
    <div><span class="label">In her collection</span> <strong>${d.daysWithOwner} ${d.daysWithOwner === 1 ? 'event' : 'events'}</strong></div>
    <div><span class="label">Owners had</span> <strong>${d.ownerCount}</strong></div>
    ${matesLine}
  `;
}

function renderStruct() {
  if (!state.doll) { $struct.innerHTML = ''; return; }
  const d = state.doll;
  const wPieces = WARDROBE_PIECES.map(p => {
    const st = d.wardrobe[p].state;
    return `<span class="piece s-${st}">${pieceLabel(d, p)} (${PIECE_STATE_LABEL[st]})</span>`;
  }).join(' · ');
  const limbs = LIMB_KEYS.map(l => {
    const st = d.body[l];
    return `<span class="part ${st}">${LIMB_LABEL[l]}: ${st}</span>`;
  }).join(' · ');
  const headState = !d.body.headAttached ? '<span class="part missing">head separated</span>' : d.body.faceShattered ? '<span class="part missing">face shattered</span>' : '<span class="part attached">head attached</span>';
  const bodyBar = `<span style="display:inline-block;vertical-align:middle;width:80px;height:5px;background:#d6c5a8;border:1px solid var(--rule);margin:0 0.4em"><span style="display:block;height:100%;background:${d.body.integrity < 25 ? 'var(--ribbon)' : d.body.integrity < 55 ? 'var(--gilt)' : 'var(--leaf)'};width:${d.body.integrity}%"></span></span>`;
  $struct.innerHTML = `
    <div><span class="label">Wardrobe</span>${wPieces}</div>
    <div class="body-line"><span class="label">Body</span>${limbs} · ${headState} · <span class="label">${d.bodyMaterial}</span>${bodyBar}<span class="num">${Math.round(d.body.integrity)}</span></div>
  `;
}

function renderRibbons() {
  if (!state.doll) { $ribbons.innerHTML = ''; return; }
  const r = state.doll.ribbons;
  const total = r.blue + r.red + r.white + r.bestOfClass + r.bestOfShow + r.originalCostume;
  let html = `<span class="label">Ribbons:</span> `;
  if (total === 0) {
    html += `<span class="none">none yet</span>`;
  } else {
    if (r.blue) html += `<span class="pill blue">${r.blue} blue</span>`;
    if (r.red) html += `<span class="pill red">${r.red} red</span>`;
    if (r.white) html += `<span class="pill white">${r.white} white</span>`;
    if (r.bestOfClass) html += `<span class="pill gold">${r.bestOfClass} Best of Class</span>`;
    if (r.bestOfShow) html += `<span class="pill gold">${r.bestOfShow} Best of Show</span>`;
    if (r.originalCostume) html += `<span class="pill gold">${r.originalCostume} Original Costume</span>`;
  }
  if (state.doll.attendedNationals) html += `<span class="pill gold">attended Nationals</span>`;
  $ribbons.innerHTML = html;
}

function renderItems() {
  if (!state.doll || state.doll.items.length === 0) {
    $items.innerHTML = '<div class="empty">Nothing on record yet.</div>';
    return;
  }
  // positive items first, then damage
  const sorted = state.doll.items.slice().sort((a, b) => (b.positive ? 1 : 0) - (a.positive ? 1 : 0));
  $items.innerHTML = sorted.map(i => {
    const cls = i.positive ? 'ix-positive' : 'ix-damage';
    return `<div class="${cls}"><span class="ix-name">${i.name}</span> <span class="ix-flavor">— ${i.flavor}</span></div>`;
  }).join('');
}

function renderMemories() {
  if (!state.doll || state.doll.memories.length === 0) {
    $memories.innerHTML = '<div class="empty">Nothing on record yet.</div>';
    return;
  }
  $memories.innerHTML = state.doll.memories.slice().reverse().map(m =>
    `<div>· ${m}</div>`
  ).join('');
}

function renderAll() {
  renderIdCard();
  renderVitals();
  renderStatus();
  renderStruct();
  renderRibbons();
  renderItems();
  renderMemories();
}

function logHTML(html) {
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  while (wrap.firstChild) $log.appendChild(wrap.firstChild);
  $log.scrollTop = $log.scrollHeight;
}

function logSceneTitle(t) { logHTML(`<p class="scene-title">— ${t} —</p>`); }
function logNarrator(text) { logHTML(`<p class="narrator">${text}</p>`); }
function logDoll(text) { logHTML(`<p class="doll">${text}</p>`); }
function logSystem(html) { logHTML(`<p class="system">${html}</p>`); }

// ============================================================
// selection screen
// ============================================================

function showSelectionScreen() {
  state.phase = "select";
  state.doll = null;
  state.ended = false;
  setAutoplay(false);
  $selectScreen.style.display = '';
  $playScreen.style.display = 'none';
  renderItems();
  renderMemories();

  $dollSelect.innerHTML = '';
  for (const tpl of DOLL_TEMPLATES) {
    const card = document.createElement('div');
    card.className = 'doll-option';
    card.innerHTML = `
      <div class="opt-name">${tpl.maker}</div>
      <div class="opt-meta">${tpl.category} · ${tpl.country} · ${tpl.yearRange[0]}–${tpl.yearRange[1]}</div>
      <div class="opt-note">${tpl.note}</div>
      <div class="opt-stats">
        Difficulty: ${tpl.difficulty} ·
        Desirability: <span class="stars">${stars(tpl.desirability, 5)}</span> ·
        Fragility: <span class="stars muted">${stars(tpl.fragility, 5)}</span>
      </div>
    `;
    card.onclick = () => beginRun(tpl);
    $dollSelect.appendChild(card);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });

// ============================================================
// game start
// ============================================================

function beginRun(tpl) {
  state.phase = "playing";
  state.doll = newDoll(tpl);
  state.ended = false;
  $selectScreen.style.display = 'none';
  $playScreen.style.display = '';
  $log.innerHTML = "";
  const d = state.doll;
  logSystem(`<strong>A new doll enters the record.</strong>`);
  logNarrator(`You are <strong>${d.maker} ${d.mold}</strong>, made in ${d.country} in ${d.year}. ${d.height} inches. Category: ${d.category}. Body material: ${d.bodyMaterial}. Currently ${d.age} years old. Registry: ${d.regNumber}.`);
  logNarrator(`Your first owner is <strong>${d.owner.label}</strong>. ${d.owner.archetype.desc}`);
  renderAll();
  nextScenario();
}

function newDoll(tpl) {
  const year = rint(tpl.yearRange[0], tpl.yearRange[1]);
  const mold = pick(tpl.molds);
  const reg = pick(REGISTRY_PREFIX) + "-" + rint(1000, 9999);
  let bisque = rint(72, 92);
  let hair = rint(55, 88);
  let eyes = rint(75, 95);
  if (tpl.bodyMaterial === "composition") { bisque -= 6; }
  if (tpl.category === "French Bébé") { bisque += 3; }
  if (tpl.category === "Cloth") { eyes = rint(60, 80); }
  if (tpl.category === "Hard Plastic") { bisque = rint(80, 95); }
  const ageYears = rint(tpl.startAge[0], tpl.startAge[1]);
  const d = {
    templateId: tpl.id,
    maker: tpl.maker,
    country: tpl.country,
    category: tpl.category,
    mold,
    year,
    height: rint(14, 32),
    regNumber: reg,
    desirability: tpl.desirability,
    fragility: tpl.fragility,
    bodyMaterial: tpl.bodyMaterial,
    wardrobeLabels: tpl.wardrobeLabels || null,
    age: ageYears,
    ageMonths: ageYears * 12,
    bisque: clamp(bisque, 0, 100),
    hair: clamp(hair, 0, 100),
    eyes: clamp(eyes, 0, 100),
    provenance: rint(8, 25),
    reputation: rint(0, 8),
    wardrobe: newWardrobe(),
    body: newBody(),
    ribbons: { blue: 0, red: 0, white: 0, bestOfClass: 0, bestOfShow: 0, originalCostume: 0 },
    attendedNationals: false,
    featuredInMagazine: false,
    items: [],
    memories: [],
    owner: null,
    ownerCount: 0,
    daysWithOwner: 0,
    targetDuration: 0,
    scenarioCount: 0,
    lastShowAt: undefined,
    pendingOutcome: null,
    ended: false,
  };
  giveOwner(d, "first");
  return d;
}

function giveOwner(d, mode, force) {
  d.ownerCount += 1;
  let archetype;
  if (force) {
    archetype = ownerById(force) || pick(OWNER_TYPES);
  } else if (mode === "first") {
    const first = OWNER_TYPES.filter(o => !o.flags.interim);
    const total = first.reduce((a, o) => a + o.weight, 0);
    let r = Math.random() * total;
    for (const o of first) { r -= o.weight; if (r <= 0) { archetype = o; break; } }
    if (!archetype) archetype = first[0];
  } else {
    const total = OWNER_TYPES.reduce((a, o) => a + o.weight, 0);
    let r = Math.random() * total;
    for (const o of OWNER_TYPES) { r -= o.weight; if (r <= 0) { archetype = o; break; } }
    if (!archetype) archetype = OWNER_TYPES[0];
  }
  d.owner = {
    archetype,
    label: archetype.label,
    collectionMates: rollCollectionMates(archetype, d),
  };
  d.daysWithOwner = 0;
  d.targetDuration = rint(archetype.duration[0], archetype.duration[1]);
}

// Roll a small set of other dolls in this owner's cabinet/inventory/house.
// Range varies by archetype — serious collectors and dealers have more;
// kids and inheritors usually have none. Each mate is a maker + mold.
const COLLECTION_MATE_COUNTS = {
  serious: [2, 4],
  curio: [0, 2],
  inheritor: [0, 1],
  hostess: [0, 1],
  hoarder: [1, 3],
  dealer: [3, 5],
  restorer: [2, 5],
  estate: [1, 3],
  child: [0, 0],
};
function rollCollectionMates(archetype, d) {
  const range = COLLECTION_MATE_COUNTS[archetype.id] || [0, 0];
  const n = rint(range[0], range[1]);
  const mates = [];
  for (let i = 0; i < n; i++) {
    let tpl;
    // make sure we don't trivially mirror the doll herself
    for (let attempt = 0; attempt < 5; attempt++) {
      tpl = pick(DOLL_TEMPLATES);
      if (!d || tpl.id !== d.templateId) break;
    }
    mates.push({ maker: tpl.maker, mold: pick(tpl.molds) });
  }
  return mates;
}

// ============================================================
// scenario selection
// ============================================================

function pickScenario(d) {
  // forced terminal: nationals and museum offer compete to fire when their guards pass
  const nationals = SCENARIOS.find(s => s.id === "nationals");
  if (nationals && (!nationals.guard || nationals.guard(d)) && roll(0.5)) {
    return nationals;
  }
  const museumOffer = SCENARIOS.find(s => s.id === "museum_offer");
  if (museumOffer && (!museumOffer.guard || museumOffer.guard(d)) && roll(0.4)) {
    return museumOffer;
  }
  // forced transition if owner duration exceeded
  if (d.daysWithOwner >= d.targetDuration) {
    const transitions = SCENARIOS.filter(s =>
      ["owner_dies", "donated", "consigned", "estate_sale", "auctioned", "inherited", "shipped"].includes(s.id) &&
      (!s.owners || s.owners.includes(d.owner.archetype.id)) &&
      (!s.guard || s.guard(d))
    );
    if (transitions.length) {
      const total = transitions.reduce((a, s) => a + (s.weight || 1), 0);
      let r = Math.random() * total;
      for (const s of transitions) { r -= (s.weight || 1); if (r <= 0) return s; }
    }
  }
  // ordinary
  const candidates = SCENARIOS.filter(s => {
    if (s.weight === 0) return false;
    if (s.owners && !s.owners.includes(d.owner.archetype.id)) return false;
    if (s.guard && !s.guard(d)) return false;
    return true;
  });
  if (candidates.length === 0) {
    return SCENARIOS.find(s => s.id === "uneventful") || SCENARIOS[0];
  }
  // hazard scaling: more fragile dolls bias toward hazardous scenarios
  const total = candidates.reduce((a, s) => a + (s.weight || 1), 0);
  let r = Math.random() * total;
  for (const s of candidates) {
    r -= (s.weight || 1);
    if (r <= 0) return s;
  }
  return candidates[candidates.length - 1];
}

// ============================================================
// core loop
// ============================================================

function nextScenario() {
  const d = state.doll;
  if (d.ended) return;
  d.daysWithOwner += 1;
  d.scenarioCount += 1;
  const sc = pickScenario(d);
  runScenario(sc);
}

function runScenario(sc) {
  const d = state.doll;
  logSceneTitle(sc.title);
  logNarrator(sc.setup(d));
  const outcome = sc.roll(d);
  applyOutcome(sc, outcome);
}

function applyOutcome(sc, outcome) {
  const d = state.doll;
  d.pendingOutcome = null;

  // narration
  if (outcome.narration) logNarrator(outcome.narration);

  // simple deltas (numeric stats)
  const applied = {};
  const dlt = outcome.deltas || {};
  for (const k in dlt) {
    const v = dlt[k];
    if (k === "bodyIntegrity") {
      d.body.integrity = clamp(d.body.integrity + v, 0, 100);
      applied.body = v;
    } else if (typeof d[k] === "number" && STAT_KEYS.includes(k)) {
      d[k] = clamp(d[k] + v, 0, 100);
      applied[k] = v;
    } else {
      console.warn(`[scenario ${sc.id}] unknown delta key: ${k}`);
    }
  }
  const reports = [];
  for (const k in applied) {
    const v = applied[k];
    if (v === 0) continue;
    const cls = v > 0 ? 'stat-up' : 'stat-dn';
    const sign = v > 0 ? '+' : '';
    reports.push(`<span class="${cls}">${sign}${v} ${k}</span>`);
  }

  // wardrobe changes
  if (outcome.wardrobeChange) {
    for (const piece in outcome.wardrobeChange) {
      const newState = outcome.wardrobeChange[piece];
      if (!d.wardrobe[piece]) {
        console.warn(`[scenario ${sc.id}] unknown wardrobe piece: ${piece}`);
        continue;
      }
      if (!PIECE_STATES.includes(newState)) {
        console.warn(`[scenario ${sc.id}] unknown wardrobe state for ${piece}: ${newState}`);
        continue;
      }
      const prev = d.wardrobe[piece].state;
      if (prev !== newState) {
        d.wardrobe[piece].state = newState;
        reports.push(`<span class="${PIECE_VALUE[newState] >= PIECE_VALUE[prev] ? 'stat-up' : 'stat-dn'}">${PIECE_LABEL[piece]} → ${PIECE_STATE_LABEL[newState]}</span>`);
      }
    }
  }

  // body changes
  if (outcome.bodyChange) {
    for (const part in outcome.bodyChange) {
      const newState = outcome.bodyChange[part];
      if (part === "headAttached" || part === "faceShattered") {
        if (d.body[part] !== newState) {
          d.body[part] = newState;
          reports.push(`<span class="stat-dn">${part}: ${newState}</span>`);
        }
      } else if (LIMB_KEYS.includes(part)) {
        if (!LIMB_STATES.includes(newState)) {
          console.warn(`[scenario ${sc.id}] unknown limb state for ${part}: ${newState}`);
          continue;
        }
        const prev = d.body[part];
        if (prev !== newState) {
          d.body[part] = newState;
          const cls = newState === "attached" ? 'stat-up' : 'stat-dn';
          reports.push(`<span class="${cls}">${LIMB_LABEL[part]}: ${newState}</span>`);
        }
      } else {
        console.warn(`[scenario ${sc.id}] unknown body part: ${part}`);
      }
    }
  }

  // ribbon (primary) + ribbonAwards (theme/best-of awards)
  if (outcome.ribbon && outcome.ribbon !== "none") {
    d.ribbons[outcome.ribbon] = (d.ribbons[outcome.ribbon] || 0) + 1;
    const cls = outcome.ribbon === "blue" ? "ribbon-blue" : "ribbon-red";
    reports.push(`<span class="${cls}">${outcome.ribbon} ribbon</span>`);
  }
  if (Array.isArray(outcome.ribbonAwards)) {
    for (const award of outcome.ribbonAwards) {
      d.ribbons[award] = (d.ribbons[award] || 0) + 1;
      const niceName = { bestOfClass: "Best of Class", bestOfShow: "Best of Show", originalCostume: "Original Costume" }[award] || award;
      reports.push(`<span class="ribbon-blue">${niceName}</span>`);
    }
  }

  if (reports.length) logSystem(reports.join(' &middot; '));

  // item
  if (outcome.item) {
    if (!d.items.some(i => i.id === outcome.item.id)) {
      d.items.push(outcome.item);
      logSystem(`gained: <span class="item-acq">${outcome.item.name}</span>`);
    }
  }

  // memory
  if (outcome.memory) {
    d.memories.push(outcome.memory);
  }

  // flags — generic copy onto the doll, plus a small special case for showCompleted
  if (outcome.flags) {
    for (const k in outcome.flags) {
      d[k] = outcome.flags[k];
    }
    if (outcome.flags.showCompleted) d.lastShowAt = d.scenarioCount;
  }

  // owner change
  if (outcome.changeOwner) {
    logSystem(`<strong>— a new owner —</strong>`);
    giveOwner(d, "next", outcome.ownerForce);
    logNarrator(`Your new owner: <strong>${d.owner.label}</strong>. ${d.owner.archetype.desc}`);
  }

  // age advances: a fixed 3-month tick per click, plus any extra from yearsElapsed
  const monthsAdvance = 3 + Math.round((outcome.yearsElapsed || 0) * 12);
  d.ageMonths += monthsAdvance;
  d.age = Math.floor(d.ageMonths / 12);

  renderAll();

  // run end checks
  if (outcome.runEnd) {
    return endRun(outcome.runEnd);
  }
  const death = checkDeath(d);
  if (death) {
    return endRun(death);
  }

  showContinue();
}

function showContinue() {
  $controls.innerHTML = '';
  const b = document.createElement('button');
  b.className = 'primary';
  b.textContent = "3 Months Pass";
  b.onclick = () => nextScenario();
  $controls.appendChild(b);
  scheduleAutoAdvance();
}

function endRun(end) {
  state.doll.ended = true;
  state.ended = true;
  state.phase = "ended";
  setAutoplay(false);
  $controls.innerHTML = '';
  const d = state.doll;

  let verdict, epitaph, isWin = false;
  if (end.kind === "blue_ribbon") {
    isWin = true;
    verdict = end.bestOfShow ? "BEST OF SHOW, NATIONALS" : "BLUE RIBBON, NATIONALS";
    const headline = end.bestOfShow
      ? `${d.maker} ${d.mold} (${d.year}) takes Best of Show at the UFDC National Convention at age ${d.age}.`
      : `${d.maker} ${d.mold} (${d.year}) wins her category at the UFDC National Convention at age ${d.age}.`;
    epitaph = `${headline} ${d.ownerCount} owners, ${d.ribbons.red + d.ribbons.white} earlier ribbons, ${d.items.filter(i => !i.positive).length} marks of damage and ${d.items.filter(i => i.positive).length} pieces of documentation accumulated along the way. She is, in the photograph that runs in the next month's bulletin, immaculate.`;
  } else if (end.kind === "museum_donation") {
    isWin = true;
    verdict = "PERMANENT MUSEUM ACCESSION";
    epitaph = `${d.maker} ${d.mold} (${d.year}) is acquired by a regional doll museum at age ${d.age}, into the permanent collection. ${d.ownerCount} owners. ${d.ribbons.blue + d.ribbons.red + d.ribbons.white} ribbons, ${d.items.filter(i => i.positive).length} pieces of documentation, ${d.items.filter(i => !i.positive).length} marks of a long life. She will be visited, behind temperature-controlled glass, by every fourth-grade class in three counties for the rest of recorded history.`;
  } else if (end.kind === "destroyed") {
    verdict = "Beyond repair.";
    epitaph = `${d.maker} ${d.mold} (${d.year}) — ${end.how}. Made it to ${d.age} years old. ${d.ownerCount} owners. ${d.ribbons.blue} blue, ${d.ribbons.red} red, ${d.ribbons.white} white. ${d.scenarioCount} events.`;
  } else {
    verdict = "End.";
    epitaph = `${d.maker} ${d.mold} (${d.year}). ${d.age} years old. ${d.ownerCount} owners. ${d.scenarioCount} events.`;
  }

  const totals = `${headLabel(d)} ${Math.round(d.bisque)} · Costume ${costumeScore(d)} · Hair ${Math.round(d.hair)} · Eyes ${Math.round(d.eyes)} · Body ${Math.round(d.body.integrity)} · Prov ${Math.round(d.provenance)} · Rep ${Math.round(d.reputation)}`;

  logHTML(`
    <div class="end-screen">
      <p class="verdict ${isWin ? 'win' : ''}">${verdict}</p>
      <p class="epitaph">${epitaph}</p>
      <p class="totals">${totals}</p>
    </div>
  `);

  const b = document.createElement('button');
  b.className = 'primary';
  b.textContent = "begin again";
  b.onclick = showSelectionScreen;
  $controls.appendChild(b);
}

// ============================================================
// autoplay
// ============================================================

function setAutoplay(on) {
  state.autoplay = on;
  if ($autoplayBtn) {
    $autoplayBtn.textContent = on ? "❚❚ pause" : "▶ play";
    $autoplayBtn.classList.toggle("playing", on);
  }
  if (on) {
    scheduleAutoAdvance();
  } else if (state.autoplayTimer) {
    clearTimeout(state.autoplayTimer);
    state.autoplayTimer = null;
  }
}

function scheduleAutoAdvance(delayMs) {
  if (!state.autoplay) return;
  if (!state.doll || state.doll.ended) return;
  if (state.phase !== "playing") return;
  if (state.autoplayTimer) clearTimeout(state.autoplayTimer);
  if (delayMs === undefined) {
    delayMs = 8000;  // single click cadence: time to read setup + outcome before the next tick
  }
  state.autoplayTimer = setTimeout(() => {
    state.autoplayTimer = null;
    if (!state.autoplay) return;
    if (!state.doll || state.doll.ended) return;
    if (state.phase !== "playing") return;
    const btns = $controls.querySelectorAll('button');
    if (btns.length === 0) return;
    btns[Math.floor(Math.random() * btns.length)].click();
  }, delayMs);
}

// ============================================================
// boot
// ============================================================

showSelectionScreen();
</script>
</body>
</html>
